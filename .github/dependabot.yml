# Dependabot version updates (ADR-011). Alerts and security updates are enabled in the repository settings.
# The npm ecosystem is added together with package.json (walking skeleton project setup, #9).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
