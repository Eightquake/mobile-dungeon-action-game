# Dependabot version updates (ADR-011). Alerts and security updates are enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'CI'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # TypeScript and typescript-eslint move together: typescript-eslint pins a TypeScript peer range,
      # so a TypeScript major waits in this group's PR until a typescript-eslint release supports it.
      # Listed first because a dependency joins the first group it matches.
      typescript:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
    commit-message:
      prefix: 'Deps'
