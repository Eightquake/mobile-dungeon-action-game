name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ADR-011 job 4. The other jobs (check, unit, e2e, budget, security) follow once package.json exists (#8).
  spec-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Spec lint
        run: python3 tools/aiup/spec-review/scripts/spec_lint.py --docs docs --strict
